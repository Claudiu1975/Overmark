plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.overmark.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.overmark.app'
        minSdk 26
        targetSdk 36
        versionCode 23
        versionName '1.7.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "edition"
    productFlavors {
        basic {
            dimension "edition"
            applicationId "com.overmark.basic"
            versionCode 20
            versionName "1.7.1"
            buildConfigField "boolean", "PRO", "false"
        }
        pro {
            dimension "edition"
            applicationId "com.overmark.app"
            versionCode 23
            versionName "1.7.2"
            buildConfigField "boolean", "PRO", "true"
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
