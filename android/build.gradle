plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.overmark.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.overmark.app'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
